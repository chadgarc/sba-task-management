<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Management</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" defer></script>

    <link rel="stylesheet" href="./css/main.css">

    <script src="./scripts/script.js" defer></script>

</head>
<body class="w-100 vh-100 d-flex flex-column">

    <header class="w-100 d-flex justify-content-center flex-column ps-2 pe-2 
                ps-sm-5 pe-sm-5 gap-3">

        <h1 class="text-white text-center mt-5 mb-3">Task management</h1>

        <nav class="mb-2 d-flex justify-content-around gap-2
                    justify-content-sm-between navbar">
            <button class="btn btn-primary rounded-3"
            data-bs-toggle="modal" data-bs-target="#filterModal" aria-label="Open filter menu">Filter</button>
            
            <button onclick="clearTasks()" class="btn btn-primary rounded-3" aria-label="Clear all tasks">Clear</button>

            <button id="addTask" class="btn btn-primary rounded-3 fw-bolder"
            data-bs-toggle="modal" data-bs-target="#addTaskModal" aria-label="Add new task">Add</button>
        </nav>

    </header>

    <main id="main-content" class="row col-11 p-4 gap-3 mx-auto content">

    </main>

    <!-- Modal pop-up for Add Task -->
    <!-- Coppied from bootstrap doc, and modified to correctly implement it to my HTML -->

    <div class="modal fade" tabindex="-1" id="addTaskModal" aria-labelledby="addTaskTitle" aria-modal="true" role="dialog">
        <!-- modeal dialog centered centers the box -->
        <div class="modal-dialog modal-dialog-centered">

            <div class="modal-content gap-2">

                <!-- Box Header -->
                <div class="modal-header">
                    <h5 class="modal-title" id="addTaskTitle">Add Task</h5>
                    <!-- Close button -->
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>

                <!-- Here, we create the elements of the box -->
                <div class="modal-body d-flex flex-column gap-2">
                    <label for="taskTitle">Enter Task Title: </label>
                    <input type="text" id="taskTitle" aria-required="true">

                    <label for="taskCategory">Enter Task Category: </label>
                    <input type="text" id="taskCategory" aria-required="true">

                    <label for="taskDate">Enter Date's Deadline: </label>
                    <input type="date" id="taskDate" aria-required="true">

                    <!-- Status Dropdown list -->
                    <div class="dropdown">
                        <button class="btn btn-secondary dropdown-toggle" type="button" id="statusButton" data-bs-toggle="dropdown" aria-expanded="false"
                        aria-label="Select task status">
                            Not Started
                        </button>
                        <ul class="dropdown-menu" aria-labelledby="statusButton">
                            <li><a class="dropdown-item dropdown-status" data-status="Not Started" aria-label="Set status to Not Started">Not Started</a></li>
                            <li><a class="dropdown-item dropdown-status" data-status="In Progress" aria-label="Set status to In Progress">In Progress</a></li>
                            <li><a class="dropdown-item dropdown-status" data-status="Completed" aria-label="Set status to Complete">Completed</a></li>

                        </ul>
                    </div>
                </div>

                <!-- The buttons we will use to close and save changes -->
                <div class="modal-footer">
                    <button type="button" onclick="resetAddModal()" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" onclick="addTask()" class="btn btn-primary">Save</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal pop-up for Filters -->

    <div class="modal fade" tabindex="-1" id="filterModal" aria-labelledby="filterTitle" aria-modal="true" role="dialog">
        <!-- modeal dialog centered centers the box -->
        <div class="modal-dialog modal-dialog-centered">

            <div class="modal-content gap-2">

                <!-- Box Header -->
                <div class="modal-header">
                    <h5 class="modal-title" id="filterTitle">Filter</h5>
                    <!-- Close button -->
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>

                <!-- Here, we create the elements of the box -->
                <div class="modal-body d-flex flex-column gap-2">
                                        
                    <div id="status-filters">
                        <h3>Filter by Status</h3>

                        <input onclick="listToContainers('status','Not Started')" type="radio" id="status-notstarted" name="groupFilter">
                        <label for="status-notstarted">Not Started</label><br>

                        <input onclick="listToContainers('status','In Progress')" type="radio" id="status-inprogress" name="groupFilter">
                        <label for="status-inprogress">In Progress</label><br>

                        <input onclick="listToContainers('status','Completed')" type="radio" id="status-completed" name="groupFilter">
                        <label for="status-completed">Completed</label><br>

                        <input onclick="listToContainers('status','Overdue')" type="radio" id="status-overdue" name="groupFilter">
                        <label for="status-overdue">Overdue</label><br>
                    
                        <h3>Filter by Category</h3>
                        <!-- New Categories -->
                        
                    </div>
                </div>

                <!-- The buttons we will use to close and save changes -->
                <div class="modal-footer">
                    <button type="button" onclick="listToContainers()" class="btn btn-secondary" data-bs-dismiss="modal">Reset</button>
                </div>
            </div>
        </div>
    </div>
    

    
</body>
</html>
